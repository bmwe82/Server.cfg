// =============================================================================
//  CS2 DEDICATED SERVER - CONFIGURAÇÃO COMPETITIVA
//  Formato: MR12 | ESL/FACEIT Compatible | Sub-tick optimized
//  Última revisão: 2025/26
// =============================================================================


// --- IDENTIDADE DO SERVIDOR ---
hostname "CS2 Competitivo"
rcon_password "ALTERAR_PARA_SENHA_FORTE"     // OBRIGATÓRIO mudar antes de ligar
sv_password ""                                // Deixar vazio para servidor público
sv_lan 0                                      // 0 = Internet, 1 = LAN
sv_region 3                                   // 3 = Europa
sv_tags "competitive,128tick,faceit,mr12"


// --- REDE E PERFORMANCE ---
sv_maxrate 0                    // Ilimitado (recomendado para servidores dedicados)
sv_minrate 786432               // ~6.2 Mbps mínimo por cliente
                                // Nota: Em uplink < 50 Mbps, usar 196608
sv_parallel_sendsnapshot 1      // Multithreading para envio de snapshots
sv_clockcorrection_msecs 15     // Janela de correção de lag reduzida (padrão: 30ms)
                                // Penaliza clientes com lag elevado, beneficia low-ping

// Interpolação
sv_client_min_interp_ratio 0
sv_client_max_interp_ratio 2


// --- FORMATO DE JOGO: MR12 COMPETITIVO ---
mp_maxrounds 24                 // 24 rondas regulamentares (MR12)
mp_halftime 1                   // Troca de lados automática ao intervalo
mp_halftime_duration 15         // 15 segundos de intervalo
mp_roundtime_defuse 1.92        // 1m 55s (CRÍTICO: não usar '2', quebra o equilíbrio)
mp_c4timer 40                   // Timer da bomba
mp_freezetime 20                // Tempo de freeze (tático elevado)
mp_buytime 20                   // Janela de compra
mp_startmoney 800               // Dinheiro inicial padrão
mp_maxmoney 16000               // Teto de dinheiro


// --- OVERTIME ---
mp_overtime_enable 1            // Ativa OT automático em empate 12-12
mp_overtime_maxrounds 6         // MR3 por side
mp_overtime_startmoney 10000    // Full buy garantido no OT


// --- FOGO AMIGO E FEEDBACK ---
mp_friendlyfire 1
ff_damage_reduction_bullets 0.33
ff_damage_reduction_grenade 0.85
sv_damage_prediction_allowed 1  // Feedback instantâneo no cliente (hitmarkers)
sv_showimpacts 0                // Desativar em produção (apenas debug)


// --- COMUNICAÇÃO ---
sv_voiceenable 1
sv_deadtalk 1                   // Mortos comunicam com a equipa
sv_full_alltalk 0               // Desativa alltalk global (evita ghosting)
sv_auto_full_alltalk_during_warmup_half_end 1  // Alltalk aberto no warmup/intervalo


// --- PROTEÇÃO ANTI-FLOOD ---
sv_max_queries_sec 5.0
sv_max_queries_sec_global 120


// --- LOGS E AUDITORIA ---
log off
sv_log_onefile 0                // Logs rotativos por sessão
sv_logbans 1
sv_logfile 1


// --- SOURCE TV (DEMO / CSTV) ---
tv_enable 0                     // Mudar para 1 para ativar CSTV
tv_autorecord 0                 // 1 = gravação automática (atenção ao espaço em disco)
tv_maxclients 5
tv_delay 105                    // 1m 45s de delay (anti-stream snipe)
tv_advertise_watchable 1


// --- WARMUP E PAUSA ---
mp_warmuptime 300               // 5 minutos
sv_pausable 1                   // Permite pausas táticas/técnicas
mp_autokick 0                   // Desativa autokick por TK acidental


// --- MISC ---
sv_hibernate_when_empty 0       // 0 = sempre pronto; 1 = poupar CPU em VPS idle


// --- BANS PERSISTENTES ---
exec banned_user.cfg
exec banned_ip.cfg
writeid
writeip
